<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><title>PACE カメラ読み込み検証</title>
  <style>
    body {
      font: 16px system-ui;
      margin: 40px;
      background: #f5f4e8;
      color: #254636;
      line-height: 1.8;
    }
    button {
      padding: 14px 24px;
    }
    video {
      width: 240px;
    }
    li {
      margin: 10px 0;
    }
    .pass {
      color: #176d3a;
    }
    .fail {
      color: #b32b15;
    }
  </style>
  <h1>カメラ認識のブラウザ検証</h1>
  <p>
    テスト用に生成した無地の映像を使います。実際のカメラにはアクセスしません。
  </p>
  <button id="run">検証を実行</button>
  <ol id="results"></ol>
  <video id="video" muted playsinline></video>
  <script type="module">
    import { CameraInput, cameraErrorMessage } from "../src/camera.js";
    const results = document.querySelector("#results");
    const assert = (value, message) => {
      if (!value) throw new Error(message);
    };
    function log(text, ok = true) {
      const li = document.createElement("li");
      li.className = ok ? "pass" : "fail";
      li.textContent = `${ok ? "PASS" : "FAIL"}: ${text}`;
      results.append(li);
    }
    async function waitFor(predicate, timeout = 30000) {
      const start = performance.now();
      while (!predicate()) {
        if (performance.now() - start > timeout) throw new Error("Timed out");
        await new Promise((resolve) => setTimeout(resolve, 100));
      }
    }
    document.querySelector("#run").onclick = async () => {
      document.querySelector("#run").disabled = true;
      results.textContent = "";
      const original = navigator.mediaDevices.getUserMedia.bind(
        navigator.mediaDevices,
      );
      const canvas = document.createElement("canvas");
      canvas.width = 640;
      canvas.height = 480;
      const ctx = canvas.getContext("2d");
      let count = 0;
      const timer = setInterval(() => {
        ctx.fillStyle = "#dddddd";
        ctx.fillRect(0, 0, 640, 480);
        ctx.fillStyle = "#aaa";
        ctx.fillRect(count++ % 620, 440, 20, 20);
      }, 50);
      let stream,
        received = 0,
        failed = "",
        lastPoints,
        requested;
      navigator.mediaDevices.getUserMedia = async (options) => {
        requested = options;
        stream = canvas.captureStream(20);
        return stream;
      };
      const camera = new CameraInput(document.querySelector("#video"), {
        onPose: (points) => {
          received++;
          lastPoints = points;
        },
        onStatus: () => {},
        onError: (error) => {
          failed = error;
        },
      });
      try {
        await camera.start();
        assert(camera.active, failed || "camera not active");
        assert(requested.audio === false, "audio was requested");
        log("マイクを要求せず映像入力を起動");
        assert(!!camera.worker, "worker unavailable, fallback used");
        log("姿勢認識モデルを専用ワーカーで読み込み");
        await waitFor(() => received > 2 || failed);
        assert(!failed, failed);
        assert(lastPoints === null, "blank video produced a pose");
        log("実際のモデルで無人の映像を解析（誤検出なし）");
        camera.stop();
        assert(
          stream.getTracks().every((track) => track.readyState === "ended"),
          "track remained active",
        );
        assert(!camera.video.srcObject && !camera.worker, "resources remained");
        log("停止時に映像トラックと認識ワーカーを解放");
        assert(
          cameraErrorMessage({ name: "NotAllowedError" }).includes("許可"),
          "permission error text",
        );
        log("カメラ拒否時の案内を確認");
        navigator.mediaDevices.getUserMedia = () =>
          new Promise((resolve) =>
            setTimeout(() => {
              stream = canvas.captureStream(20);
              resolve(stream);
            }, 100),
          );
        const pending = camera.start();
        camera.stop();
        await pending;
        assert(
          stream.getTracks().every((track) => track.readyState === "ended"),
          "cancelled request leaked stream",
        );
        log("許可待ち中にキャンセルしても後からカメラが残らない");
        const done = document.createElement("p");
        done.id = "done";
        done.textContent = "6 / 6 検証完了";
        results.after(done);
      } catch (error) {
        log(String(error), false);
      } finally {
        camera.stop();
        clearInterval(timer);
        navigator.mediaDevices.getUserMedia = original;
        document.querySelector("#run").disabled = false;
      }
    };
  </script>
</html>
